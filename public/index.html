<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>INR EXCHANGE - India's Premier Fixed 6% Daily Compounding Platform</title>
  <meta name="description" content="Trade with fixed 6% 60-second contracts, instant QR code recharges, 20% withdrawal processing, and powerful admin control.">
  <link rel="icon" type="image/jpeg" href="/images/logo.jpg">
  <link rel="manifest" href="/manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="INR Exchange">
  <link rel="apple-touch-icon" href="/images/icon-192.png">
  <link rel="stylesheet" href="/css/style.css">
  <meta name="theme-color" content="#090C16">
</head>
<body>

  <!-- PWA Install Banner (Google Chrome) -->
  <div id="pwa-install-banner" class="pwa-banner" style="display: none;">
    <div class="pwa-content">
      <img src="/images/icon-192.png" alt="App Icon" class="pwa-icon">
      <div class="pwa-text">
        <div class="pwa-title">Install INR EXCHANGE App</div>
        <div class="pwa-sub">Add to Home Screen for fast, 1-tap trading & recharges</div>
      </div>
    </div>
    <div class="pwa-actions">
      <button id="pwa-install-btn" class="btn-pwa-install">Install</button>
      <button id="pwa-dismiss-btn" class="btn-pwa-dismiss" onclick="dismissPwaBanner()">&times;</button>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- App Wrapper Container -->
  <div class="app-container">

    <!-- Sticky Header -->
    <header id="app-header" class="app-header"></header>

    <!-- News Announcement Ticker -->
    <div id="ticker-bar" class="ticker-bar"></div>

    <!-- Demo Environment Notice (Requirement 10) -->
    <div id="demo-notice-bar" style="background: rgba(255, 171, 0, 0.1); border-bottom: 1px solid rgba(255, 171, 0, 0.25); padding: 5px 10px; font-size: 10px; color: #FFD54F; text-align: center; font-weight: 700; line-height: 1.3;">
      ⚠️ DEMO SIMULATION MODE: Test environment with virtual trading & demo accounts until authorized for real financial services.
    </div>

    <!-- Main Dynamic Tab Content -->
    <main id="main-content" class="main-view"></main>

    <!-- Bottom Navigation Bar -->
    <nav id="bottom-nav" class="bottom-nav"></nav>

  </div>

  <!-- 60-Second Trade Order Modal (Reference Screenshot UI) -->
  <div id="trade-modal" class="modal-overlay" onclick="if(event.target === this) closeTradeModal()">
    <div id="trade-sheet-content" class="bottom-sheet"></div>
  </div>

  <!-- General Notification & Admin Gate Modal -->
  <div id="general-modal" class="modal-overlay" onclick="if(event.target === this) closeGeneralModal()"></div>

  <!-- Application Logic -->
  <script src="/js/app.js"></script>

</body>
</html>
